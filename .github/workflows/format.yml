name: "Format"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    name: "Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Format
        run: bun run format